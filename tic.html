<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f4f9;
    }
    h1 {
      margin-bottom: 20px;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-template-rows: repeat(3, 100px);
      gap: 10px;
    }
    .cell {
      background-color: white;
      border: 2px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .cell:hover {
      background-color: #f0f0f0;
    }
    .cell.occupied:hover {
      background-color: white;
      cursor: default;
    }
    .winning-cell {
      background-color: #d4edda !important;
      color: #155724 !important;
    }
    #statusIndicator {
      margin-bottom: 10px;
      font-weight: bold;
      font-size: 1.2rem;
    }
    .winner {
      color: green;
      font-size: 1.2rem;
      margin-top: 20px;
    }
    button {
      margin-top: 15px;
      padding: 8px 16px;
      background-color: #333;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #555;
    }
  </style>
</head>
<body>
  <h1>Tic Tac Toe</h1>
  <div id="statusIndicator">Player X's Turn</div>
  <div class="board" id="board"></div>
  <div class="winner" id="winnerText"></div>
  <button id="resetBtn">Restart Game</button>

  <script>
    const board = document.getElementById("board");
    const winnerText = document.getElementById("winnerText");
    const statusIndicator = document.getElementById("statusIndicator");
    const resetBtn = document.getElementById("resetBtn");

    let currentPlayer = "X";
    let gameActive = true;
    let cells = Array(9).fill("");

    // Create cells
    for (let i = 0; i < 9; i++) {
      const cell = document.createElement("div");
      cell.classList.add("cell");
      cell.dataset.index = i;
      cell.addEventListener("click", handleClick);
      board.appendChild(cell);
    }

    function handleClick(e) {
      const index = e.target.dataset.index;
      if (!gameActive || cells[index] !== "") return;

      cells[index] = currentPlayer;
      e.target.textContent = currentPlayer;
      e.target.classList.add("occupied");

      const winPattern = checkWinner();
      if (winPattern) {
        winnerText.textContent = `🎉 Player ${currentPlayer} Wins!`;
        statusIndicator.textContent = "Game Over";
        gameActive = false;
        winPattern.forEach(idx => {
          board.children[idx].classList.add("winning-cell");
        });
        return;
      }

      if (!cells.includes("")) {
        winnerText.textContent = "🤝 It's a Draw!";
        statusIndicator.textContent = "Game Over";
        gameActive = false;
        return;
      }

      currentPlayer = currentPlayer === "X" ? "O" : "X";
      statusIndicator.textContent = `Player ${currentPlayer}'s Turn`;
    }

    function checkWinner() {
      const winPatterns = [
        [0, 1, 2],
        [3, 4, 5],
        [6, 7, 8],
        [0, 3, 6],
        [1, 4, 7],
        [2, 5, 8],
        [0, 4, 8],
        [2, 4, 6],
      ];

      for (const pattern of winPatterns) {
        const [a, b, c] = pattern;
        if (cells[a] && cells[a] === cells[b] && cells[a] === cells[c]) {
          return pattern;
        }
      }
      return null;
    }

    resetBtn.addEventListener("click", () => {
      cells.fill("");
      currentPlayer = "X";
      gameActive = true;
      winnerText.textContent = "";
      statusIndicator.textContent = "Player X's Turn";
      document.querySelectorAll(".cell").forEach(cell => {
        cell.textContent = "";
        cell.classList.remove("occupied");
        cell.classList.remove("winning-cell");
      });
    });
  </script>
</body>
</html>
